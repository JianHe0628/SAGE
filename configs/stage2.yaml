defaults:
  - sage
  - _self_

# Stage 2 translation hyperparameters
project: SAGE_Stage2
batch_size: 2
epochs: 80
comments: ""
log_test: false
seg_annotation: ""
max_segment_length: 45
finetune: ""

# Optimizer
opt: sgd
opt_eps: 1.0e-9
opt_betas: null
clip_grad: false
momentum: 0.9
weight_decay: 0.001

# LR schedule
sched: cosine
lr: 1.0e-2
lr_noise: null
lr_noise_pct: 0.67
lr_noise_std: 1.0
warmup_lr: 1.0e-6
min_lr: 1.0e-8
decay_epochs: 30
warmup_epochs: 0
cooldown_epochs: 10
patience_epochs: 10
decay_rate: 0.1

# Dropout / augmentation
drop: 0.0
drop_path: 0.1
mixup: 0.0
cutmix: 0.0
cutmix_minmax: null
mixup_prob: 1.0
mixup_switch_prob: 0.5
mixup_mode: batch

# Runtime
output_dir: ""
device: cuda
seed: 0
resume: ""
start_epoch: 0
eval: false
eval_output: ""
num_workers: 4
pin_mem: true
input_size: 224
resize: 256
visualize: false

hydra:
  run:
    dir: .
  output_subdir: null
